[project]
name = "dealership-inventory"
version = "0.1.0"
description = "Backend-first dealership inventory demo"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "fastapi>=0.162,<0.163",
  "psycopg[binary]>=3.3,<3.4",
  "uvicorn>=0.54,<0.55",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
install = "python -m pip install --no-deps -r requirements.lock"
